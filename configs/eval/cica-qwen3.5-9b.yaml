# CICA-Qwen3.5-9B in thinking mode. Same settings as its base model. The checkpoint includes its processor.
name: CICA-Qwen3.5-9B
model: seul77/CICA-Qwen3.5-9B  # Hugging Face id or local path (or pass --model)
enable_thinking: true
per_item_seed: true
sampling:
  temperature: 0.6
  top_p: 0.95
  top_k: 20
  min_p: 0.0
  presence_penalty: 0.0
  repetition_penalty: 1.0
  max_tokens: 32768
max_model_len: 65536
max_images: 128
batch_size: 4096  # items per vLLM call; lower it if host memory is short
gpu_memory_utilization: 0.85
